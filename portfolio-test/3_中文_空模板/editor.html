<!doctype html><html lang="zh-CN" data-auth-pending><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑作品集模板</title><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="github-auth.css?v=entry-login-1"><script defer src="template-source.js"></script><script defer src="template-engine.js"></script><script defer src="github-save.js?v=account-header-1"></script><script defer src="editor.js?v=account-header-1"></script></head><body>
<header><h1>编辑作品集模板</h1><div id="normal-actions"><span id="status" hidden>正在读取</span><button id="reset-template" type="button">还原模板</button><button id="exit">退出</button><button id="save">保存</button><button id="locate-unedited" type="button">定位未编辑项</button><button id="preview" class="primary">预览网站 ↗</button></div><div id="locate-actions" class="locator-actions" hidden></div></header>
<div class="layout"><aside><nav id="tabs" aria-label="编辑页面"></nav><section id="panel"></section><footer>自动保存在本机；点击保存同步 GitHub <button id="backup">备份资料 ↗</button></footer></aside><main><iframe id="canvas" title="实时预览" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><section id="palette" hidden aria-label="文字颜色"></section></main></div>
<dialog id="item-dialog"><div class="dialog-head"><h2>编辑作品资料</h2><div id="item-locate-actions" class="locator-actions" hidden></div><button id="close-item" aria-label="关闭">×</button></div><div class="dialog-grid"><section id="item-fields"></section><div class="item-preview"><h3>卡片实时预览</h3><iframe id="item-canvas" title="作品卡片预览" sandbox="allow-scripts"></iframe><section id="item-palette" hidden></section></div></div><div class="dialog-actions"><span>附件仅供后续人工制作，不公开导出</span><button id="cancel-item">取消</button><button id="save-item" class="primary">保存作品资料</button></div></dialog><dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description"><div class="dialog-head"><h2 id="reset-title">还原模板？</h2><button id="close-reset" type="button" aria-label="关闭还原确认">×</button></div><div class="reset-body"><p id="reset-description">还原后，当前草稿中所有编辑的文字、颜色、图片、简历、作品附件及补充资料都会清空；新增、删除和隐藏状态也会恢复为初始空白模板。</p><p>此操作无法撤回，其他草稿不受影响。需要保留资料时，请先取消并备份。</p><p id="reset-error" role="alert" hidden></p></div><div class="dialog-actions"><button id="cancel-reset" type="button" autofocus>取消</button><button id="confirm-reset" type="button" class="danger">确认还原</button></div></dialog><div id="toast" role="status"></div></body></html>
