<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module">
    import {renderSite} from "./site-renderer.mjs";
    const TEMPLATE = {
      brandName: "SUNDAY STUDIO",
      heroTitle: "把日常，过成喜欢的样子。",
      heroDesc: "为认真生活的人，挑选一些简单、耐用、值得每天使用的好物。",
      heroButton: "逛逛本周精选",
      productTitle: "让生活慢一点，也好一点",
      product1Title: "晨光马克杯", product1Desc: "手作陶土 · 温润好握",
      product2Title: "周末托特包", product2Desc: "再生棉麻 · 轻盈耐用",
      product3Title: "窗边香氛", product3Desc: "植物精油 · 安静陪伴",
      storyTitle: "好东西，值得慢慢挑。",
      storyDesc: "我们从材质、触感和使用习惯出发，找到那些经得起时间的日常小物。少一点匆忙，多一点刚刚好的喜欢。",
      featureTitle: "我们相信的小事",
      feature1Title: "认真选材", feature1Desc: "从源头开始，关注每一份材料的来处。",
      feature2Title: "简约耐用", feature2Desc: "不过度设计，让好用陪伴更久。",
      feature3Title: "轻一点生活", feature3Desc: "少一些浪费，多一点自在和余裕。",
      resourceTitle: "Sunday Studio 品牌手册",
      resourceDesc: "认识我们的故事、选品原则与日常灵感。",
      contactTitle: "想和我们聊聊吗？",
      contactDesc: "欢迎来信分享你的想法，或一起探索下一件好物。",
      email: "hello@sunday.studio"
    };
    const FIELD_DEFAULTS = Object.fromEntries(Object.keys(TEMPLATE).map(key => [key, ""]));
    const ASSET_KEYS = ["heroImage", "product1Image", "product2Image", "product3Image", "storyImage", "resourcePdf"];
    const ASSET_LABELS = {heroImage:"封面图片", product1Image:"商品图片一", product2Image:"商品图片二", product3Image:"商品图片三", storyImage:"品牌故事图片", resourcePdf:"PDF 文件"};
    const DB_NAME = "yepian-template-demo";
    const DB_STORE = "assets";
    let mode = "template";
    let toastTimer;
    let objectUrls = {};
    let SAVE_SERVICE_URL="";
    let serviceReady=null;
    let isSaving=false;
    let editKey=null, pendingAccount=null;
    let draft={fields:{...FIELD_DEFAULTS},assets:{},siteId:null};
    function persistDraft(){} // Editing state stays in memory; saved content is loaded after authentication.
    function esc(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]))}
    function text(value,fallback,showFallback=true){const clean=String(value||"").trim();return clean?esc(clean).replace(/\n/g,"<br>"):showFallback?`<span class="placeholder">${esc(fallback)}</span>`:""}
    function showToast(message){const node=document.getElementById("toast");node.textContent=message;node.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove("show"),3500)}
    function dbOpen(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>request.result.createObjectStore(DB_STORE);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    async function dbPut(key,blob){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(blob,draft.siteId+":"+key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
    async function dbGet(key){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readonly");const req=tx.objectStore(DB_STORE).get(draft.siteId+":"+key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
    async function dbDelete(key){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(draft.siteId+":"+key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
    async function restoreAssets(){for(const key of ASSET_KEYS){if(draft.assets[key]){try{const blob=await dbGet(key);if(blob)objectUrls[key]=URL.createObjectURL(blob)}catch{}}}if(mode==="editor")render()}
    const TEMPLATE_SITE=renderSite({fields:TEMPLATE,placeholders:false});
    function brand(){return `<div class="brand"><span class="brand-mark">页</span><span>页间 <span style="color:#969a91;font-weight:500">/ studio</span></span></div>`}
    function renderTemplate(){document.getElementById("app").innerHTML=`<header class="topbar">${brand()}<div class="top-actions"><span class="pill"><i class="dot active"></i> 模板预览</span><button class="btn small" data-action="choose">选择作为模板 <span aria-hidden="true">↗</span></button></div></header><main class="shell"><div class="page-head"><div><div class="eyebrow">TEMPLATE 01 · SUNDAY STUDIO</div><h1>先选一个喜欢的起点。</h1><p>这是一个完整的生活方式品牌网站模板。选择后，会生成模块顺序一致的空白编辑页。</p></div><div class="pill">6 个内容模块 <span style="color:#a3a79d">·</span> 图片与 PDF 支持</div></div><div class="template-card"><div class="browser-bar"><span class="browser-dots"><i></i><i></i><i></i></span><span class="browser-label">sunday-studio.example</span><span>100%</span></div><div class="web-frame">${TEMPLATE_SITE}</div></div></main><div class="bottom-bar"><div class="bottom-copy"><strong>Sunday Studio · 日常选物</strong><small>极简、温暖的生活方式品牌模板</small></div><div class="bottom-buttons"><button class="btn secondary" data-action="export-template">下载模板说明</button><button class="btn" data-action="choose">选择作为模板 <span aria-hidden="true">↗</span></button></div></div>`}
    function field(label,key,placeholder="在这里填写",full=false,multiline=false){return `<div class="field${full?" full":""}"><label for="f-${key}">${esc(label)}</label>${multiline?`<textarea id="f-${key}" data-field="${key}" placeholder="${esc(placeholder)}">${esc(draft.fields[key])}</textarea>`:`<input id="f-${key}" data-field="${key}" value="${esc(draft.fields[key])}" placeholder="${esc(placeholder)}">`}</div>`}
    function uploadField(key,accept,label,detail){const asset=draft.assets[key];return `<div class="upload"><div class="upload-meta"><span class="upload-icon">${key==="resourcePdf"?"PDF":"＋"}</span><div><strong>${asset?esc(asset.name):esc(label)}</strong><small>${asset?formatBytes(asset.size):esc(detail)}</small></div></div><div class="upload-actions"><label>上传<input type="file" data-file="${key}" accept="${accept==="image/*"?"image/png,image/jpeg,image/gif,image/webp":accept}"></label>${asset?`<button type="button" data-remove="${key}">移除</button>`:""}</div></div>`}
    function formatBytes(bytes=0){if(bytes<1024)return `${bytes} B`;return `${(bytes/1024).toFixed(0)} KB`}
    function moduleCard(number,title,description,body){return `<section class="module-card"><div class="module-top"><div class="module-name"><span class="module-num">${number}</span><div><h3>${title}</h3><p>${description}</p></div></div></div>${body}</section>`}
    function renderEditor(){

      const editor=`${moduleCard("01","首屏介绍","标题、简短说明和主视觉",`<div class="field-grid">${field("品牌名称","brandName","例如：Sunday Studio",true)}${field("主标题","heroTitle","例如：把日常，过成喜欢的样子。",true,true)}${field("补充说明","heroDesc","用一两句话介绍这个网站",true,true)}${field("按钮文案","heroButton","例如：了解更多") }<div class="field full"><label>主视觉图片</label>${uploadField("heroImage","image/*","还没有封面图片","JPG、PNG、WebP，建议横版")}</div></div>`)}
        ${moduleCard("02","精选内容","三张卡片，每张可填写说明并上传图片",`<div class="field-grid">${field("模块标题","productTitle","例如：本周精选",true)}${[1,2,3].map(i=>`${field(`卡片 ${i} 标题`,`product${i}Title`,`填写名称`)}${field(`卡片 ${i} 说明`,`product${i}Desc`,`简短介绍`)}<div class="field full"><label>卡片 ${i} 图片</label>${uploadField(`product${i}Image`,"image/*","上传一张图片","JPG、PNG、WebP")}</div>`).join("")}</div>`)}
        ${moduleCard("03","品牌故事","介绍品牌、项目或你希望访客了解的背景",`<div class="field-grid">${field("故事标题","storyTitle","填写一段标题",true)}${field("故事内容","storyDesc","分享你的品牌故事",true,true)}<div class="field full"><label>故事图片</label>${uploadField("storyImage","image/*","还没有故事图片","JPG、PNG、WebP")}</div></div>`)}
        ${moduleCard("04","特点与价值","用三个简短条目说明特色",`<div class="field-grid">${field("模块标题","featureTitle","例如：我们相信的小事",true)}${[1,2,3].map(i=>field(`特点 ${i} 标题`,`feature${i}Title`,`填写特点`)+field(`特点 ${i} 说明`,`feature${i}Desc`,`用一句话说明`)).join("")}</div>`)}
        ${moduleCard("05","资料下载","添加一个 PDF 文件和说明",`<div class="field-grid">${field("资料名称","resourceTitle","例如：品牌手册",true)}${field("资料说明","resourceDesc","告诉访客这份资料是什么",true,true)}<div class="field full"><label>PDF 文件</label>${uploadField("resourcePdf","application/pdf,.pdf","还没有 PDF 文件","仅支持 PDF，单个文件最大 5 MB")}</div></div>`)}
        ${moduleCard("06","联系信息","给访客一个联系你的方式",`<div class="field-grid">${field("模块标题","contactTitle","例如：想和我们聊聊吗？",true)}${field("联系邮箱","email","hello@example.com",true)}${field("补充说明","contactDesc","邀请访客联系你",true,true)}</div>`)}
        <div class="empty-note">填写内容会即时显示在右侧预览中。保存到 GitHub 后，会在仓库 <code>user-sites/</code> 目录生成独立页面和素材文件。</div>`;
      document.getElementById("app").innerHTML=`<header class="topbar">${brand()}<div class="top-actions"><span class="pill"><i class="dot ${serviceReady?"active":""}"></i>统一保存到站点仓库</span></div></header><main class="shell"><div class="studio-head"><div class="eyebrow">BLANK SITE · TEMPLATE 01</div><div class="head-row"><div><h1>编辑你的页面</h1><p>模块与 Sunday Studio 模板一一对应。填写内容、添加图片或 PDF，右侧会即时预览。</p></div><button class="btn ghost small" data-action="back">← 返回模板</button></div></div><div class="workspace"><div class="module-list">${editor}</div><aside class="editor-preview"><div class="preview-title"><strong>实时页面预览</strong><span>桌面版 · 自动更新</span></div><div class="preview-frame"><div class="web-frame" id="live-preview"></div></div></aside></div></main><div class="bottom-bar"><div class="bottom-copy"><strong>${serviceReady?"云端保存已就绪":"编辑内容尚未保存"}</strong><small>${serviceReady?"保存后会生成独立网页；内容将公开":"云端保存待管理员配置，请保持当前编辑页打开"}</small></div><div class="bottom-buttons"><button class="btn secondary" data-action="export">导出 JSON</button><button class="btn" data-action="save">保存修改 <span aria-hidden="true">↗</span></button></div></div>`;
      renderPreview();
    }
    function renderPreview(){const preview=document.getElementById("live-preview");if(preview)preview.innerHTML=renderSite({fields:draft.fields,assets:draft.assets,urls:objectUrls})}
    function render(){if(mode==="template")renderTemplate();else renderEditor()}
    function chooseTemplate(phone=''){
      document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><h2 id="login-title">输入手机号码</h2><p>输入手机号后点击确认。首次使用会生成找回码，已有账号可继续编辑之前的页面。手机号仅作账号标识，不发送短信。</p><form id="account-form"><div class="field"><label for="account-phone">手机号码（11 位数字）</label><input id="account-phone" value="${esc(phone)}" inputmode="numeric" autocomplete="off" maxlength="11" pattern="[0-9]{11}" required placeholder="请输入 11 位手机号码"></div><p id="account-error" role="alert" style="color:#b34032"></p><div class="modal-actions"><button type="button" class="btn secondary" data-action="dismiss">取消</button><button type="submit" class="btn">确认</button></div></form></section></div>`;
      document.getElementById('account-form').onsubmit=e=>{e.preventDefault();authenticate(true)};
      document.getElementById('account-phone').focus();
    }
    function requestRecoveryCode(phone){
      document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><h2 id="login-title">输入找回码</h2><p>该手机号已有专属页面。请输入之前保存的找回码，继续编辑。</p><form id="account-form"><div class="field"><label for="account-phone">手机号码</label><input id="account-phone" value="${esc(phone)}" readonly></div><div class="field"><label for="account-code">找回码</label><input id="account-code" type="password" autocomplete="off" required placeholder="输入之前保存的找回码"></div><p id="account-error" role="alert" style="color:#b34032"></p><div class="modal-actions"><button type="button" class="btn secondary" id="change-phone">更换手机号</button><button type="submit" class="btn">验证并继续编辑</button></div></form></section></div>`;
      document.getElementById('account-form').onsubmit=e=>{e.preventDefault();authenticate(false)};
      document.getElementById('change-phone').onclick=()=>chooseTemplate(phone);
      document.getElementById('account-code').focus();
    }
    async function authenticate(register){
      const form=document.getElementById('account-form');if(!form.reportValidity())return;
      const phone=document.getElementById('account-phone').value,code=(document.getElementById('account-code')?.value||'');
      const error=document.getElementById('account-error');
      if(!/^[0-9]{11}$/.test(phone)){error.textContent='手机号码必须是 11 位数字';return}
      if(!register&&!code.trim()){error.textContent='请输入之前保存的找回码';return}
      form.querySelectorAll('button').forEach(b=>b.disabled=true);
      try{
        if(!SAVE_SERVICE_URL)throw Error('登录服务尚未就绪，请稍后重试');
        const response=await fetch(SAVE_SERVICE_URL+(register?'/api/start':'/api/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code}),signal:AbortSignal.timeout(120000)});
        const result=await response.json();if(!response.ok)throw Error(result.error||'登录失败');
        if(result.existing){requestRecoveryCode(phone);return}
        if(result.recoveryCode){pendingAccount=result;
          document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>请保存你的找回码</h2><p>下次进入编辑需要手机号和此找回码。请复制保存在安全的地方；本网站不会通过短信发送，也不能自动找回。</p><div class="field"><label>找回码</label><input readonly id="new-recovery-code" value="${esc(result.recoveryCode)}"></div><button class="btn secondary small" data-action="copy-code">复制找回码</button><p id="copy-feedback" role="status"></p><label><input id="code-confirm" type="checkbox"> 我已保存手机号和找回码</label><div class="modal-actions"><button class="btn" data-action="enter-account">我已保存，开始编辑</button></div></section></div>`;
        }else await enterAccount(result);
      }catch(e){error.textContent=e.message;form.querySelectorAll('button').forEach(b=>b.disabled=false)}
    }
    async function enterAccount(result){
      for(const url of Object.values(objectUrls))URL.revokeObjectURL(url);objectUrls={};
      draft={siteId:result.siteId,fields:{...FIELD_DEFAULTS,...result.fields},assets:{}};
      for(const asset of result.assets){const blob=new Blob([Uint8Array.from(atob(asset.data),c=>c.charCodeAt(0))],{type:asset.type});await dbPut(asset.key,blob);draft.assets[asset.key]={name:asset.name,type:asset.type,size:blob.size};objectUrls[asset.key]=URL.createObjectURL(blob)}
      editKey=result.token;pendingAccount=null;mode='editor';history.replaceState(null,'','#edit/'+result.siteId);
      document.getElementById('modal-root').innerHTML='';render();window.scrollTo(0,0);
    }
    function setMode(next){
      if(isSaving){showToast('正在保存，请稍候');return}
      if(mode==='editor'&&!confirm('返回模板将退出编辑。请确认已保存修改，下次进入需要重新验证。'))return;
      if(editKey)fetch(SAVE_SERVICE_URL+'/api/logout',{method:'POST',headers:{Authorization:`Bearer ${editKey}`}}).catch(()=>{});
      editKey=null;draft={fields:{...FIELD_DEFAULTS},assets:{},siteId:null};for(const url of Object.values(objectUrls))URL.revokeObjectURL(url);objectUrls={};
      history.replaceState(null,'',location.pathname);mode=next;render();window.scrollTo(0,0);
    }
    function download(name,content,type="application/json"){const blob=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
    async function exportDraft(){const assets={};for(const key of ASSET_KEYS){if(!draft.assets[key])continue;const blob=await dbGet(key);if(blob)assets[key]={name:draft.assets[key].name,type:blob.type,data:await blobToBase64(blob)}}download("yepian-site-draft.json",JSON.stringify({template:"sunday-studio",siteId:draft.siteId,fields:draft.fields,assets},null,2));showToast("编辑内容已导出为 JSON")}
    async function blobToBase64(blob){const bytes=new Uint8Array(await blob.arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
    async function checkSaveService(){
      try{const config=await (await fetch("./site-config.json",{cache:"no-store"})).json();SAVE_SERVICE_URL=typeof config.saveServiceUrl==="string"?config.saveServiceUrl.replace(/\/$/,""):"";if(!SAVE_SERVICE_URL){serviceReady=false;return}const response=await fetch(`${SAVE_SERVICE_URL}/api/status`,{credentials:"omit",signal:AbortSignal.timeout(10000)});const data=await response.json();serviceReady=response.ok&&data.ready===true}catch{serviceReady=false}
      if(mode==="editor")render();
    }
    async function save(){
      if(isSaving)return;
      persistDraft();isSaving=true;
      const button=document.querySelector('[data-action="save"]');if(button){button.disabled=true;button.textContent="正在保存…"}
      try{
        if(!SAVE_SERVICE_URL)throw new Error("共享保存接口尚待站点管理员部署并授权");
        const fields={...draft.fields};const assets=[];
        for(const key of ASSET_KEYS){if(!draft.assets[key])continue;const blob=await dbGet(key);if(!blob)throw new Error("有上传文件未能从本机读取，请重新上传后保存");assets.push({key,name:draft.assets[key].name,type:blob.type,data:await blobToBase64(blob)})}
        const response=await fetch(`${SAVE_SERVICE_URL}/api/save`,{method:"POST",credentials:"omit",headers:{"Content-Type":"application/json",Authorization:`Bearer ${editKey}`},body:JSON.stringify({siteId:draft.siteId,fields,assets}),signal:AbortSignal.timeout(120000)});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||"云端暂时无法保存，请稍后重试");
        serviceReady=true;
        document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" data-action="dismiss"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="saved-heading"><h2 id="saved-heading">已保存到站点仓库</h2><p>文字、图片和 PDF 已一并提交。网页公开链接会在 Pages 发布完成后生效，通常需稍等片刻。</p><div class="modal-actions"><a class="btn secondary small" href="${esc(result.commitUrl)}" target="_blank" rel="noreferrer">查看保存记录</a><a class="btn small" href="${esc(result.url)}" target="_blank" rel="noreferrer">打开我的页面 ↗</a><button class="btn ghost small" data-action="close-result">关闭</button></div></section></div>`;
      }catch(error){showToast(`${error.name==="TimeoutError"?"保存耗时较长，请稍后重试":error.message}。请保持当前页面打开后重试`)}
      finally{isSaving=false;const button=document.querySelector('[data-action="save"]');if(button){button.disabled=false;button.innerHTML='保存修改 <span aria-hidden="true">↗</span>'}}
    }
    function exportTemplate(){download("sunday-studio-template.json",JSON.stringify({template:"sunday-studio",modules:["首屏介绍","精选内容","品牌故事","特点与价值","资料下载","联系信息"],fields:TEMPLATE},null,2));showToast("模板说明已下载")}
    document.addEventListener("input",event=>{const key=event.target.dataset.field;if(!key)return;draft.fields[key]=event.target.value;persistDraft();renderPreview()});
    document.addEventListener("change",async event=>{const key=event.target.dataset.file;if(!key)return;const file=event.target.files?.[0];if(!file)return;const isPdf=key==="resourcePdf";if(isPdf&&file.type!=="application/pdf"){showToast("请选择 PDF 文件");event.target.value="";return}if(!isPdf&&!["image/png","image/jpeg","image/gif","image/webp"].includes(file.type)){showToast("图片支持 PNG、JPEG、GIF 和 WebP");event.target.value="";return}if(file.size>5*1024*1024){showToast("单个文件最大 5 MB");event.target.value="";return}try{await dbPut(key,file);if(objectUrls[key])URL.revokeObjectURL(objectUrls[key]);objectUrls[key]=URL.createObjectURL(file);draft.assets[key]={name:file.name,type:file.type,size:file.size};persistDraft();render();showToast(`${ASSET_LABELS[key]}已添加`)}catch{showToast("浏览器无法保存此文件，请换一个较小的文件")}});
    document.addEventListener("click",async event=>{const actionable=event.target.closest("[data-action]");const action=actionable?.dataset.action;if(action){if(action==="dismiss"&&event.target!==actionable)return;if(action==="copy-code"){try{await navigator.clipboard.writeText(pendingAccount.recoveryCode);document.getElementById('copy-feedback').textContent='已复制，请妥善保存'}catch{document.getElementById('new-recovery-code').select();document.getElementById('copy-feedback').textContent='请手动复制上方找回码'}}if(action==="enter-account"){if(!document.getElementById('code-confirm').checked){showToast('请先保存找回码并勾选确认');return}try{await enterAccount(pendingAccount)}catch{showToast('页面加载失败，请重试')}}if(action==="choose")chooseTemplate();if(action==="back")setMode("template");if(action==="export")exportDraft();if(action==="export-template")exportTemplate();if(action==="save")save();if(action==="close-result"||action==="dismiss")document.getElementById("modal-root").innerHTML="";return}const remove=event.target.closest("[data-remove]")?.dataset.remove;if(remove){await dbDelete(remove);if(objectUrls[remove])URL.revokeObjectURL(objectUrls[remove]);delete objectUrls[remove];delete draft.assets[remove];persistDraft();render();showToast("已移除文件")}});
    render();checkSaveService();
    window.addEventListener("beforeunload",event=>{if(mode==="editor"){event.preventDefault();event.returnValue=""}});
  </script>
</body>
</html>
